[workspace]
resolver = "2"
members = [
    "crates/storage",
    "crates/agent_config",
    "crates/agent",
    "crates/tray",
    "crates/ui",
    "crates/logging",
    "crates/overlay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
