[package]
name = "overlay"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ghostperf-overlay"
path = "src/main.rs"

[dependencies]
agent_config = { version = "0.1.0", path = "../agent_config" }
anyhow = "1.0.104"
eframe = "0.37.0"
egui = "0.37.0"
global-hotkey = "0.10.0"
log = "0.4.35"
logging = { version = "0.1.0", path = "../logging" }

# Embeds assets/icon/ghostperf.ico into the exe (see build.rs) — the overlay
# reuses the main brand icon rather than a new one, since it has no
# taskbar/Alt-Tab presence by design (see TODO.md Phase 6).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
