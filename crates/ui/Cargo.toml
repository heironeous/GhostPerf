[package]
name = "ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ghostperf-ui"
path = "src/main.rs"

[dependencies]
agent_config = { version = "0.1.0", path = "../agent_config" }
anyhow = "1.0.104"
chrono = "0.4.45"
csv = "1.4.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
egui_plot = "0.38.0"
log = "0.4.35"
logging = { version = "0.1.0", path = "../logging" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
storage = { version = "0.1.0", path = "../storage" }

# Embeds assets/icon/ghostperf-ui.ico into the exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
